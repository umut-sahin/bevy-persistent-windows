[package]
name = "bevy-persistent-windows"
description = "A Bevy plugin to easily create and manage windows that remember where they were."
categories = ["game-development"]
keywords = ["gamedev", "bevy", "persistent", "window"]
repository = "https://github.com/umut-sahin/bevy-persistent-windows/"
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Umut Şahin <umutsahin@protonmail.com>",
]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_window", "bevy_winit", "serialize"] }
bevy-persistent = { version = "0.11" }
serde = { version = "1.0", features = ["derive"] }
winit = { version = "0.31", default-features = false }

[dev-dependencies]
dirs = { version = "6.0" }
bevy = { version = "0.19" }
bevy-persistent = { version = "0.11", features = ["toml"] }

[features]
default = ["x11"]
library = ["bevy-persistent/library"]
x11 = ["bevy/x11"]
bincode = ["bevy-persistent/bincode"]
toml = ["bevy-persistent/toml"]

[package.metadata.docs.rs]
features = ["library"]
